  description: >-
    OAuth 2.0 authorization code flow with PKCE (S256) and dynamic client registration (RFC 7591). Agents
    register a client at /oauth/register (redirect_uris required — a live POST with an empty body returned
    400 invalid_client_metadata "redirect_uris is required"), send the user to /oauth/authorize, exchange the
    code at /oauth/token, and refresh without human intervention beyond the initial consent. A token's scope

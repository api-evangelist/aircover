end_user_sign_in:
  note: >-
    End users of the Aircover app sign in with Google OAuth, Microsoft OAuth (Azure AD) or a per-organization
    OIDC/SSO provider (Okta, Auth0, Azure AD B2C). Personal email domains are refused; new sign-ups receive
    a trial license. These are the identities an MCP client's OAuth consent screen delegates to; they are not
    themselves API credentials.
  methods:
  - Google OAuth (requests calendar scopes; Drive scopes optional for CMS indexing)
  - Microsoft OAuth / Azure AD (requests Microsoft Graph calendar scopes; OneDrive optional)
  - OIDC / SSO configured per customer organization
  source: https://www.aircover.ai/llms.txt

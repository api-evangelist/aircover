  only rate-limit evidence is indirect and provider-authored: the official aircover-pipeline client retries
  HTTP 429 and 5xx with exponential backoff and "honors Retry-After when present" (CHANGELOG 1.0.1), which
  tells a consumer the customer API can answer 429 with a Retry-After header, but not the limit, window or
  scope. The provider's own skills advise narrowing list_meetings windows (200+ meetings "will take a few
  minutes") and calling get_deal once per deal — capacity guidance, not a published quota.

- aid: aircover:aircover-public-agent-api
  name: Aircover Public Agent API
  description: >-
    The public, agent-facing API surface of Aircover described by an OpenAPI 3.0.3 contract: the OAuth 2.0
    authorization server (authorize, token, dynamic client registration, revocation), the RFC 8414 and
    RFC 9728 discovery documents, and the MCP JSON-RPC endpoint. Seven operations with unique operationIds
    and typed schemas. The full customer REST API used by the aircover-pipeline CLI (/auth/login,
    /analytics/, /coaching-templates, /transcript/coaching) is available to customers on request and is
    not covered by the published contract.
  humanURL: https://www.aircover.ai/developers
  baseURL: https://api.aircover.ai

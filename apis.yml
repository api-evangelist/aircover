apis:
- aid: aircover:aircover-mcp-server
  name: Aircover MCP Server
  description: >-
    Remote Model Context Protocol server over Streamable HTTP at https://api.aircover.ai/mcp. An authenticated
    Aircover user's agent can list and read meetings and transcripts, ask questions across indexed documents,
    list AI agents and fetch their per-meeting results, read deal qualification results, list deals, teams
    and reports. Twelve read-only tools; access is OAuth 2.0 authorization code + PKCE with dynamic client
    registration, and every request is bounded by the authorizing user's own role and organization.
  humanURL: https://www.aircover.ai/developers
  baseURL: https://api.aircover.ai/mcp
  image: https://www.aircover.ai/assets/apple-touch-icon.png
  tags:
  - MCP
  - agent-native
  - Sales Enablement
  - Conversation Intelligence

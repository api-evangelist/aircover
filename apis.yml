aid: aircover
name: Aircover
description: >-
  Aircover is an AI-native revenue agent platform for sales teams: specialist AI agents work before, during
  and after every customer conversation, joining Zoom, Microsoft Teams, Google Meet and Webex calls to
  surface real-time coaching, objection handling, battlecards and technical answers from live transcription
  (no recording by default), then generating notes, follow-ups, MEDDPICC-style qualification scoring and
  CRM updates into Salesforce, HubSpot and ServiceNow. For developers and agents the company publishes a
  remote Model Context Protocol server at https://api.aircover.ai/mcp (Streamable HTTP, OAuth 2.0 with
  PKCE and RFC 7591 dynamic client registration, twelve read tools over meetings, transcripts, agent results,
  deals, teams, reports and documents), an OpenAPI 3.0.3 contract for the public agent API, an MCP registry
  server.json manifest, llms.txt, markdown content negotiation on every page, four open-source Claude/ChatGPT
  Skills and a PyPI-published Python pipeline CLI. The full customer REST API and webhooks are customer-only.
image: https://www.aircover.ai/assets/apple-touch-icon.png

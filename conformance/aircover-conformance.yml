    from https://www.aircover.ai/openapi.json (HTTP 200, application/json, 16,478 bytes).
- id: mcp
  name: Model Context Protocol (Streamable HTTP)
  conforms: true
  evidence: >-
    https://api.aircover.ai/mcp answers POST initialize / tools/list with 401 + WWW-Authenticate: Bearer
    resource_metadata="https://api.aircover.ai/.well-known/oauth-protected-resource", the MCP authorization
    spec's challenge shape; CORS allows the Mcp-Protocol-Version header. The developer page names the
    transport as Streamable HTTP.
- id: mcp-registry-server-json
  name: MCP Registry server.json
  conforms: true
  evidence: >-
    https://www.aircover.ai/.well-known/mcp.json (200) declares $schema
